name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  # The carrier is built from an immutable DeepSeek Harness source revision.
  # Do not silently move this to master: the harness is in developer preview
  # and explicitly allows compatibility-breaking changes.
  DEEPSEEK_HARNESS_REF: 47f943859bef60e4160492346772ded9b24f765a

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  release:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release archive
        run: |
          set -euo pipefail
          ver="${{ github.event.inputs.version || github.ref_name }}"
          ver="${ver#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: $ver" >&2
            exit 1
          fi
          mkdir -p dist
          name="salad-${{ matrix.goos }}-${{ matrix.goarch }}"
          suffix=""
          [[ "${{ matrix.goos }}" == "windows" ]] && suffix=".exe"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build \
            -ldflags "-s -w -X main.Version=${ver} -X github.com/salad-ai/salad-terminal/internal/auth.BuildVersion=${ver}" \
            -o "dist/salad${suffix}" \
            ./cmd/salad
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd dist && zip -q "${name}.zip" "salad${suffix}")
            rm -f "dist/salad${suffix}"
          else
            tar -C dist -czf "dist/${name}.tar.gz" salad
            rm -f dist/salad
          fi
          ls -la dist

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: terminal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  harness:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: amd64
            dsh_target: node24-macos-x64
            runner: ubuntu-latest
          - platform: darwin
            arch: arm64
            dsh_target: node24-macos-arm64
            runner: ubuntu-latest
          - platform: linux
            arch: amd64
            dsh_target: node24-linux-x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            dsh_target: node24-linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Salad Terminal
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Checkout pinned DeepSeek Harness
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/deepseek-ai/deepseek-harness.git "$RUNNER_TEMP/deepseek-harness"
          git -C "$RUNNER_TEMP/deepseek-harness" checkout --detach "$DEEPSEEK_HARNESS_REF"
          test "$(git -C "$RUNNER_TEMP/deepseek-harness" rev-parse HEAD)" = "$DEEPSEEK_HARNESS_REF"

      - name: Build verified ACP carrier
        run: |
          set -euo pipefail
          mkdir -p dist
          ./tools/build-dsh-acp-carrier.sh \
            "$RUNNER_TEMP/deepseek-harness" \
            "${{ matrix.dsh_target }}" \
            "$RUNNER_TEMP/dsh-dist"
          archive="salad-harness-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          files=("dsh-acp-agent-${{ matrix.platform }}-${{ matrix.arch }}" cordis.yml)
          if [[ "${{ matrix.platform }}" == "darwin" ]]; then
            helper="dsh-acp-agent-${{ matrix.platform }}-${{ matrix.arch }}-spawn-helper"
            test -x "$RUNNER_TEMP/dsh-dist/$helper"
            files+=("$helper")
          fi
          tar -C "$RUNNER_TEMP/dsh-dist" -czf "dist/$archive" "${files[@]}"
          ls -lh "dist/$archive"

      - name: Upload harness archive
        uses: actions/upload-artifact@v6
        with:
          name: harness-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  harness-smoke-linux:
    needs: [harness]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Salad Terminal
        uses: actions/checkout@v6

      - name: Download Linux carrier
        uses: actions/download-artifact@v6
        with:
          name: harness-linux-${{ matrix.arch }}
          path: dist

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Prove Linux network deny boundary
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          if bwrap --ro-bind / / --dev /dev --proc /proc --die-with-parent --unshare-net \
            -- python3 -c 'import socket; socket.create_connection(("1.1.1.1", 443), 2)' \
            >"$work/stdout" 2>"$work/stderr"; then
            echo 'network unexpectedly reachable inside deny profile' >&2
            exit 1
          fi
          grep -Eqi 'network|resolve|unreachable|timed out|refused|operation not permitted' "$work/stderr" || {
            cat "$work/stderr" >&2
            echo 'network denial did not produce a recognized failure' >&2
            exit 1
          }

      - name: Boot packaged Linux carrier through ACP
        run: |
          set -euo pipefail
          archive="dist/salad-harness-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p smoke/unpack smoke/workspace
          tar -xzf "$archive" -C smoke/unpack
          python3 tools/smoke-dsh-carrier.py \
            --carrier "smoke/unpack/dsh-acp-agent-linux-${{ matrix.arch }}" \
            --config smoke/unpack/cordis.yml \
            --workspace "$PWD/smoke/workspace"

  terminal-smoke-windows:
    needs: [release]
    runs-on: windows-latest
    steps:
      - name: Checkout Salad Terminal
        uses: actions/checkout@v6

      - name: Download Windows terminal archive
        uses: actions/download-artifact@v6
        with:
          name: terminal-windows-amd64
          path: dist

      - name: Verify Windows terminal and explicit engineer capability boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath (Join-Path $PWD 'dist/salad-windows-amd64.zip') -DestinationPath (Join-Path $PWD 'smoke') -Force
          $terminal = Join-Path $PWD 'smoke/salad.exe'
          $version = & $terminal version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^salad ') {
            throw "Windows terminal version check failed: $version"
          }
          $help = & $terminal engineer --help
          $helpText = $help -join "`n"
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'no longer a separate terminal') {
            throw 'Windows engineer deprecation contract failed'
          }
          $doctorStart = [System.Diagnostics.ProcessStartInfo]::new()
          $doctorStart.FileName = $terminal
          $doctorStart.ArgumentList.Add('harness')
          $doctorStart.ArgumentList.Add('doctor')
          $doctorStart.RedirectStandardOutput = $true
          $doctorStart.RedirectStandardError = $true
          $doctorStart.UseShellExecute = $false
          $doctorProcess = [System.Diagnostics.Process]::new()
          $doctorProcess.StartInfo = $doctorStart
          [void]$doctorProcess.Start()
          $doctorText = $doctorProcess.StandardOutput.ReadToEnd() + $doctorProcess.StandardError.ReadToEnd()
          $doctorProcess.WaitForExit()
          $doctorExit = $doctorProcess.ExitCode
          if ($doctorExit -eq 0 -or $doctorText -notmatch 'executable is unavailable|managed install: not installed') {
            throw "Windows must report the missing engineer carrier explicitly: $doctorText"
          }

  publish:
    needs: [test, release, harness, harness-smoke-linux, terminal-smoke-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v6
        with:
          pattern: '*-*-*'
          path: dist
          merge-multiple: true

      - name: Create release manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          printf '%s\n' "$version" > dist/VERSION
          (cd dist && sha256sum salad-*.* > SHA256SUMS)
          printf '{"version":"%s","artifacts":[' "$version" > dist/release-manifest.json
          first=1
          while read -r hash name; do
            [[ "$first" == 1 ]] || printf ',' >> dist/release-manifest.json
            first=0
            printf '{"name":"%s","sha256":"%s"}' "$name" "$hash" >> dist/release-manifest.json
          done < dist/SHA256SUMS
          printf ']}\n' >> dist/release-manifest.json
          jq -e --arg version "$version" '
            .version == $version
            and (.artifacts | length == 10)
            and all(.artifacts[]; (.name | length > 0) and (.sha256 | test("^[0-9a-f]{64}$")))
          ' dist/release-manifest.json >/dev/null

      - name: Attest release archives
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Salad Terminal ${GITHUB_REF_NAME#v}" \
            --notes "Cross-platform Salad Terminal release. macOS/Linux use install.sh (which also installs the pinned Salad Harness carrier); Windows uses install.ps1. Artifacts are accompanied by SHA256SUMS and release-manifest.json."
