name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  release:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release archive
        run: |
          set -euo pipefail
          ver="${{ github.event.inputs.version || github.ref_name }}"
          ver="${ver#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: $ver" >&2
            exit 1
          fi
          mkdir -p dist
          name="salad-${{ matrix.goos }}-${{ matrix.goarch }}"
          suffix=""
          [[ "${{ matrix.goos }}" == "windows" ]] && suffix=".exe"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build \
            -ldflags "-s -w -X main.Version=${ver}" \
            -o "dist/salad${suffix}" \
            ./cmd/salad
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd dist && zip -q "${name}.zip" "salad${suffix}")
            rm -f "dist/salad${suffix}"
          else
            tar -C dist -czf "dist/${name}.tar.gz" salad
            rm -f dist/salad
          fi
          ls -la dist

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: terminal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [test, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v6
        with:
          pattern: terminal-*
          path: dist
          merge-multiple: true

      - name: Create release manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          printf '%s\n' "$version" > dist/VERSION
          (cd dist && sha256sum salad-*.* > SHA256SUMS)
          printf '{"version":"%s","artifacts":[' "$version" > dist/release-manifest.json
          first=1
          while read -r hash _ name; do
            [[ "$first" == 1 ]] || printf ',' >> dist/release-manifest.json
            first=0
            printf '{"name":"%s","sha256":"%s"}' "$name" "$hash" >> dist/release-manifest.json
          done < dist/SHA256SUMS
          printf ']}\n' >> dist/release-manifest.json

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Salad Terminal ${GITHUB_REF_NAME#v}" \
            --notes "Cross-platform Salad Terminal release. macOS/Linux use install.sh; Windows uses install.ps1. Artifacts are accompanied by SHA256SUMS and release-manifest.json."
